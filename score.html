<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Score | ENGLISHouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #003580 0%, #0056b3 100%); }
        .score-card { border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <nav class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-blue-800 tracking-tighter">ENGLIS<span class="text-blue-500">House</span></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white p-10 text-center score-card border border-gray-100">
            <div class="mb-6">
                <div class="inline-flex items-center justify-center w-24 h-24 bg-yellow-100 rounded-full mb-4">
                    <span class="text-5xl">🏆</span>
                </div>
                <h1 class="text-3xl font-black text-slate-800 mb-2">Great Job!</h1>
                <p class="text-gray-500 font-medium">You have completed the Quiz</p>
            </div>

            <div class="py-8 bg-blue-50 rounded-3xl mb-8 border border-blue-100">
                <p class="text-sm font-bold text-blue-600 uppercase tracking-widest mb-1">Your Final Score</p>
                <h2 class="text-6xl font-black text-blue-900">100<span class="text-2xl text-blue-400">/100</span></h2>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-10 text-sm font-bold">
                <div class="p-4 bg-gray-50 rounded-2xl">
                    <p class="text-gray-400 uppercase text-[10px] mb-1">Accuracy</p>
                    <p class="text-green-600">Perfect!</p>
                </div>
                <div class="p-4 bg-gray-50 rounded-2xl">
                    <p class="text-gray-400 uppercase text-[10px] mb-1">Time Spent</p>
                    <p class="text-slate-700">02:45</p>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="location.href='certificate.html'" class="w-full bg-yellow-400 text-yellow-900 py-4 rounded-2xl font-bold text-lg shadow-xl hover:bg-yellow-500 transition flex items-center justify-center gap-2">
                    Claim Certificate 🎓
                </button>
                
                <button onclick="location.href='dashboard.html'" class="w-full hero-gradient text-white py-4 rounded-2xl font-bold text-lg shadow-xl hover:opacity-90 transition">
                    Back to Dashboard
                </button>

                <button onclick="location.href='quiz.html'" class="w-full bg-white text-gray-500 py-3 rounded-2xl font-bold hover:bg-gray-50 transition border border-gray-100">
                    Retake Quiz
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white py-8 border-t mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400 text-sm font-medium">
            <p>&copy; 2026 ENGLISHouse. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
