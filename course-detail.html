<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Detail | ENGLISHouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #003580 0%, #0056b3 100%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <button onclick="location.href='dashboard.html'" class="mr-4 text-gray-400 hover:text-blue-800 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <span class="text-2xl font-bold text-blue-800 tracking-tighter">ENGLIS<span class="text-blue-500">House</span></span>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-white border-b py-16">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <div id="courseBadge" class="inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest mb-4 text-white">Program Detail</div>
            <h1 id="courseTitle" class="text-4xl md:text-5xl font-black text-slate-900 mb-6 tracking-tight">Loading...</h1>
            <p id="courseDesc" class="text-gray-600 text-lg max-w-3xl mx-auto mb-10 leading-relaxed">
                </p>
            
            <button onclick="processEnrollment()" class="bg-blue-800 text-white px-10 py-4 rounded-2xl font-bold shadow-xl hover:bg-blue-900 transition transform hover:-translate-y-1">
                Enroll in This Class
            </button>
        </div>
    </section>

    <main class="max-w-4xl mx-auto px-4 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <h3 class="text-xl font-bold mb-6 text-blue-800">Apa yang akan Anda pelajari:</h3>
                <ul id="objectiveList" class="space-y-4 text-gray-600">
                    </ul>
            </div>
            <div class="space-y-6">
                <div class="bg-blue-50 p-8 rounded-3xl border border-blue-100">
                    <h3 class="text-blue-900 font-bold mb-2 uppercase text-xs tracking-widest">Requirement</h3>
                    <p id="requirementText" class="text-blue-700 text-sm font-medium">Minimal level Intermediate (B1). Cocok untuk mahasiswa hukum atau praktisi profesional.</p>
                </div>
                <div class="bg-gray-50 p-8 rounded-3xl border border-gray-200">
                    <h3 class="text-gray-800 font-bold mb-2 uppercase text-xs tracking-widest">Duration</h3>
                    <p class="text-gray-600 text-sm font-medium">12 Pertemuan (Akses Selamanya)</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Data yang sudah diperbaiki sesuai permintaan Anda
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        const data = {
            'law': {
                title: 'English for Law',
                badge: 'bg-slate-800',
                desc: 'Melatih peserta untuk terampil berkomunikasi dalam Bahasa Inggris baik secara lisan maupun tulisan dengan menggunakan terminologi-terminologi hukum.',
                objectives: ['Legal Writing & Drafting', 'Client Interviewing Techniques', 'Understanding Legal Terms', 'Advocacy & Negotiation Skills'],
                req: 'Cocok untuk mahasiswa hukum atau praktisi profesional.'
            },
            'med': {
                title: 'English for Medical Purposes',
                badge: 'bg-red-600',
                desc: 'Program khusus bagi tenaga medis untuk meningkatkan kemampuan komunikasi profesional dengan pasien dan kolega internasional.',
                objectives: ['Medical Communication Skills', 'Professional Medical Terms', 'Patient Interaction', 'Medical Report Writing'],
                req: 'Disarankan untuk Dokter, Perawat, atau Mahasiswa Kedokteran.'
            },
            'teen': {
                title: 'English for Teen & Adult',
                badge: 'bg-yellow-500',
                desc: 'Program peningkatan kemampuan Bahasa Inggris harian dan profesional untuk remaja serta dewasa agar lebih percaya diri.',
                objectives: ['Confident Daily Speaking', 'Slang & Idiomatic Expression', 'Public Speaking Basics', 'Professional Presentation'],
                req: 'Tersedia untuk semua level dari pemula hingga mahir.'
            }
        };

        // Mengambil data berdasarkan klik, jika tidak ada (buka manual) maka tampilkan pesan pilih kelas
        if (type && data[type]) {
            const current = data[type];
            document.getElementById('courseTitle').innerText = current.title;
            document.getElementById('courseBadge').innerText = current.title;
            document.getElementById('courseBadge').classList.add(current.badge);
            document.getElementById('courseDesc').innerText = current.desc;
            document.getElementById('requirementText').innerText = current.req;

            const listContainer = document.getElementById('objectiveList');
            current.objectives.forEach(obj => {
                const li = document.createElement('li');
                li.className = "flex items-start";
                li.innerHTML = `<span class="bg-green-100 text-green-600 rounded-full p-1 mr-3"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span> <span>${obj}</span>`;
                listContainer.appendChild(li);
            });
        } else {
            // Jika siswa buka file ini langsung tanpa lewat dashboard
            document.getElementById('courseTitle').innerText = "Please Select a Program";
            document.getElementById('courseDesc').innerText = "Silakan kembali ke Dashboard untuk memilih program yang tersedia.";
            document.querySelector('button').style.display = 'none';
        }

        function processEnrollment() {
            localStorage.setItem('enrolled_' + type, 'true');
            alert('Sukses! Anda telah terdaftar di kelas ' + data[type].title);
            window.location.href = 'dashboard.html';
        }
    </script>

    <footer class="bg-white py-12 border-t mt-10">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400 text-sm">
            <p>&copy; 2026 ENGLISHouse. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
