<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard | ENGLISHouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #003580 0%, #0056b3 100%); }
        .rank-card { border-radius: 20px; transition: all 0.3s ease; }
        .rank-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .gold { background: linear-gradient(135deg, #FFD700, #FDB931); }
        .silver { background: linear-gradient(135deg, #C0C0C0, #E8E8E8); }
        .bronze { background: linear-gradient(135deg, #CD7F32, #E9967A); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <button onclick="location.href='dashboard.html'" class="mr-4 text-gray-400 hover:text-blue-800 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <span class="text-2xl font-bold text-blue-800 tracking-tighter">ENGLIS<span class="text-blue-500">House</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Your Rank</p>
                        <p class="text-sm font-black text-blue-800">#42 Worldwide</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-gradient text-white py-12 text-center">
        <h1 class="text-4xl font-black mb-2">Global Leaderboard</h1>
        <p class="opacity-80">Top performers of the week in ENGLISHouse</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-10">
        
        <div class="grid grid-cols-3 gap-4 mb-12 items-end text-center">
            <div class="space-y-2">
                <div class="w-16 h-16 silver rounded-full mx-auto flex items-center justify-center text-white border-4 border-white shadow-lg">
                    <span class="font-bold text-xl">2</span>
                </div>
                <p class="font-bold text-sm text-gray-700">Sarah W.</p>
                <p class="text-xs font-bold text-blue-600">2,850 pts</p>
            </div>
            <div class="space-y-2 scale-110">
                <div class="w-20 h-20 gold rounded-full mx-auto flex items-center justify-center text-white border-4 border-white shadow-xl relative">
                    <span class="font-bold text-3xl">1</span>
                    <span class="absolute -top-4 text-2xl">👑</span>
                </div>
                <p class="font-black text-lg text-slate-800">Alex J.</p>
                <p class="text-sm font-bold text-blue-600">3,120 pts</p>
            </div>
            <div class="space-y-2">
                <div class="w-16 h-16 bronze rounded-full mx-auto flex items-center justify-center text-white border-4 border-white shadow-lg">
                    <span class="font-bold text-xl">3</span>
                </div>
                <p class="font-bold text-sm text-gray-700">Budi R.</p>
                <p class="text-xs font-bold text-blue-600">2,400 pts</p>
            </div>
        </div>

        <div class="space-y-3">
            <div class="bg-blue-800 text-white p-5 rank-card flex items-center justify-between shadow-lg ring-4 ring-blue-100">
                <div class="flex items-center gap-4">
                    <span class="font-bold w-6">42</span>
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold">L</div>
                    <span class="font-bold">Learner Name (You)</span>
                </div>
                <span class="font-black">1,240 pts</span>
            </div>

            <div class="bg-white p-5 border border-gray-100 rank-card flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <span class="font-bold text-gray-300 w-6">04</span>
                    <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-400">K</div>
                    <span class="font-bold text-slate-700">Kevin Malone</span>
                </div>
                <span class="font-black text-slate-800">2,100 pts</span>
            </div>

            <div class="bg-white p-5 border border-gray-100 rank-card flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <span class="font-bold text-gray-300 w-6">05</span>
                    <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-400">A</div>
                    <span class="font-bold text-slate-700">Angela M.</span>
                </div>
                <span class="font-black text-slate-800">1,980 pts</span>
            </div>
        </div>

    </main>

    <footer class="bg-white py-8 border-t mt-10">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400 text-[10px] font-bold uppercase tracking-widest">
            Data refreshes every 24 hours
        </div>
    </footer>

</body>
</html>
