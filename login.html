<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - ENGLISHouse</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #4b0082; color: white; }
        .login-box { background: white; padding: 30px; border-radius: 10px; color: #333; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #ffcc00; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        <input type="text" placeholder="Username/Email">
        <input type="password" placeholder="Password">
        <button onclick="alert('Fitur Login segera hadir dengan Firebase!')">LOGIN</button>
        <p><a href="index.html">Kembali ke Beranda</a></p>
    </div>
</body>
</html>
