<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ENGLISHouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-blue-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
        <h2 id="formTitle" class="text-2xl font-black text-blue-900 mb-6 italic uppercase">Student Login</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="EMAIL ADDRESS" class="w-full border-b-2 py-2 outline-none focus:border-yellow-400 font-bold uppercase text-xs">
            <input type="password" id="password" placeholder="PASSWORD" class="w-full border-b-2 py-2 outline-none focus:border-yellow-400 font-bold uppercase text-xs">
            <button onclick="handleAuth()" id="authBtn" class="w-full bg-blue-900 text-white py-4 rounded-xl font-bold tracking-widest hover:bg-yellow-400 hover:text-black transition uppercase mt-4 shadow-lg">Login</button>
            <p class="text-center text-[10px] font-bold text-gray-500 uppercase mt-4">
                <span id="toggleText">Belum punya akun?</span> 
                <button onclick="toggleMode()" id="toggleBtn" class="text-blue-900 underline ml-1">Daftar Sekarang</button>
            </p>
        </div>
        <a href="index.html" class="block mt-6 text-[10px] font-bold text-gray-400 uppercase">← Kembali ke Beranda</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAffpby-SpWcQEcBIAuAotfXbhjY07s-_k",
            authDomain: "englishhouse-60f07.firebaseapp.com",
            projectId: "englishhouse-60f07",
            storageBucket: "englishhouse-60f07.firebasestorage.app",
            messagingSenderId: "764611033159",
            appId: "1:764611033159:web:6c3546cfe3b0e9a2945962",
            measurementId: "G-LKNVC5PT2E"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? 'Student Login' : 'Student Register';
            document.getElementById('authBtn').innerText = isLoginMode ? 'Login' : 'Register';
            document.getElementById('toggleText').innerText = isLoginMode ? 'Belum punya akun?' : 'Sudah punya akun?';
            document.getElementById('toggleBtn').innerText = isLoginMode ? 'Daftar Sekarang' : 'Login Sekarang';
        }

        function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) { alert('Isi semua kolom!'); return; }

            if (isLoginMode) {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => { window.location.href = 'index.html'; })
                    .catch(error => alert('Gagal Login: ' + error.message));
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => { alert('Akun berhasil dibuat!'); toggleMode(); })
                    .catch(error => alert('Gagal Daftar: ' + error.message));
            }
        }
    </script>
</body>
</html>
