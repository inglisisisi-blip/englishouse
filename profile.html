<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ENGLISHouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #003580 0%, #0056b3 100%); }
        .profile-card { border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <button onclick="location.href='dashboard.html'" class="mr-4 text-gray-400 hover:text-blue-800 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <span class="text-2xl font-bold text-blue-800 tracking-tighter">ENGLIS<span class="text-blue-500">House</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="location.href='index.html'" class="text-sm font-bold text-red-500 hover:text-red-700">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white p-8 profile-card border border-gray-100 text-center">
                    <div class="w-32 h-32 bg-blue-100 rounded-full mx-auto mb-4 flex items-center justify-center border-4 border-white shadow-lg overflow-hidden">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar">
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Learner Name</h2>
                    <p class="text-gray-400 text-sm mb-6">Student Member since 2026</p>
                    
                    <div class="grid grid-cols-2 gap-4 pt-6 border-t border-gray-50">
                        <div>
                            <p class="text-2xl font-black text-blue-800">12</p>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Courses In Progress</p>
                        </div>
                        <div>
                            <p class="text-2xl font-black text-yellow-500">5</p>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Certificates</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white p-8 profile-card border border-gray-100 mb-8">
                    <h3 class="text-xl font-bold text-slate-800 mb-6">Learning Activity</h3>
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-600">English Grammar Master</span>
                            <span class="text-xs font-bold text-green-500 bg-green-50 px-3 py-1 rounded-full">Completed</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full">
                            <div class="bg-green-500 h-2 rounded-full w-full"></div>
                        </div>

                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-600">Daily Conversation</span>
                            <span class="text-xs font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full">100% Correct</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full">
                            <div class="bg-blue-600 h-2 rounded-full w-full"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-8 profile-card border border-gray-100">
                    <h3 class="text-xl font-bold text-slate-800 mb-6">Recent Certificates</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="p-4 border-2 border-dashed border-gray-100 rounded-2xl flex items-center gap-4 hover:border-blue-200 transition cursor-pointer" onclick="location.href='certificate.html'">
                            <div class="text-3xl">📜</div>
                            <div>
                                <p class="text-sm font-bold text-slate-700">Conversation Certificate</p>
                                <p class="text-[10px] text-gray-400 uppercase">Issued: Mar 13, 2026</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-white py-12 border-t mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-400 text-sm">
            <p>&copy; 2026 ENGLISHouse. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
